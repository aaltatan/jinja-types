site_name: jinja-types
site_description: Python type methods and attributes as qualified Jinja2 filters and tests, safe in the sandbox and described by a typed catalog.
site_url: https://aaltatan.github.io/jinja-types/
repo_url: https://github.com/aaltatan/jinja-types
repo_name: aaltatan/jinja-types
edit_uri: edit/main/docs/
copyright: GPL-3.0-or-later

theme:
  name: material
  icon:
    logo: material/code-braces
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Installation: install.md
  - User guide:
      - guide/index.md
      - Setup and options: guide/setup.md
      - Strict values and conversion: guide/conversion.md
      - Regular expressions: guide/regex.md
      - Locales and Arabic: guide/locale.md
      - Registries and the catalog: guide/registry.md
      - Writing a plugin: guide/plugins.md
      - Types and namespaces:
          - guide/types/index.md
          - str: guide/types/str.md
          - int: guide/types/int.md
          - float: guide/types/float.md
          - decimal: guide/types/decimal.md
          - fraction: guide/types/fraction.md
          - date: guide/types/date.md
          - datetime: guide/types/datetime.md
          - time: guide/types/time.md
          - timedelta: guide/types/timedelta.md
          - list: guide/types/list.md
          - dict: guide/types/dict.md
          - uuid: guide/types/uuid.md
          - path: guide/types/path.md
          - re: guide/types/re.md
          - pattern: guide/types/pattern.md
          - match: guide/types/match.md
          - ar: guide/types/ar.md
          - babel: guide/types/babel.md
          - helpers: guide/types/helpers.md
  - Recipes: recipes.md
  - Reference:
      - reference/index.md
      - API: reference/api.md
      - Catalog and CLI: reference/catalog.md
      - Exceptions: reference/exceptions.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaltatan/jinja-types
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/jinja-types/

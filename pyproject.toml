[project]
name = "jinja-types"
version = "0.1.0"
description = "Python type methods and attributes as qualified Jinja2 filters and tests."
readme = "README.md"
authors = [
    { name = "aaltatan", email = "a.altatan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arapy>=0.1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
regex = ["regex"]
babel = ["babel"]
hijri = ["arapy[hijri]>=0.1.0"]
shape = ["arapy[shape]>=0.1.0"]

[project.scripts]
jinja-types = "jinja_types.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-jsonschema>=4.26.0.20261006",
    "tzdata>=2026.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
# locale output really contains Arabic separators and narrow no-break spaces
"src/jinja_types/contrib/babel.py" = ["RUF001", "RUF002"]
"src/jinja_types/types/ar_.py" = ["RUF001", "RUF002"]
"tests/test_ar.py" = ["RUF001", "RUF002"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "jinja_types.regex.re_"
warn_return_any = false  # the engine (re or the untyped regex library) returns Any

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jinja_types.core --cov-report=term-missing:skip-covered"

[tool.coverage.report]
fail_under = 95

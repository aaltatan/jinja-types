[project]
name = "jinja-types"
version = "0.1.0"
description = "Python type methods and attributes as qualified Jinja2 filters and tests."
readme = "README.md"
authors = [
    { name = "aaltatan", email = "a.altatan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
]

[project.optional-dependencies]
regex = ["regex"]
babel = ["babel"]

[project.scripts]
jinja-types = "jinja_types.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "tzdata>=2026.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jinja_types.core --cov-report=term-missing:skip-covered"

[tool.coverage.report]
fail_under = 95
